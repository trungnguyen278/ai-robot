# Drop-in for the Chromium snap's kiosk daemon, installed by tools/pi/kiosk.sh.
# - It starts with Ubuntu Frame and the robot, and only once the robot serves its screen, so
#   that the kiosk never opens on an error page.
# - It stops and starts again with Frame (PartOf), and starts again whenever it exits:
#   Chromium exits with status 0 when Frame goes away, which the snap's Restart=on-failure
#   leaves down.
# - --no-first-run: a fresh profile otherwise waits on the first-run dialog and never loads
#   the page.
[Unit]
Wants=snap.ubuntu-frame.daemon.service ai-robot.service
After=snap.ubuntu-frame.daemon.service ai-robot.service
PartOf=snap.ubuntu-frame.daemon.service

[Service]
Environment=CHROMIUM_FLAGS=--no-first-run
ExecStartPre=/usr/bin/curl --silent --fail --output /dev/null --max-time 2 --retry 60 --retry-delay 1 --retry-all-errors @URL@
Restart=always
