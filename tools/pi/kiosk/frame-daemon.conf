# Drop-in for Ubuntu Frame's daemon, installed by tools/pi/kiosk.sh: Chromium's kiosk starts
# whenever Frame starts.
# - Chromium's own drop-in stops and restarts it with Frame (PartOf=), but PartOf= never passes
#   a start (systemd.unit(5)), and a unit that a job stopped is not restarted (Restart=,
#   systemd.service(5)).
# - snapd stops Frame's services and starts them again whenever it refreshes the snap: without
#   this, Chromium would stay down until the next boot.
[Unit]
Wants=snap.chromium.daemon.service
