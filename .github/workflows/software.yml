name: software

on:
  push:
    branches: [main]
    paths:
      - "software/**"
      - "protocol/screen/**"
      - "platform"
      - ".github/workflows/software.yml"
  pull_request:
    paths:
      - "software/**"
      - "protocol/screen/**"
      - "platform"
      - ".github/workflows/software.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # The robot's own OS (docs/decisions/0017-ros-2.md), not whatever ubuntu-latest becomes.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11: the oldest supported version; 3.13: Raspberry Pi OS "Trixie"; 3.14: Ubuntu
        # 26.04 (as of 2026-10)
        python-version: ["3.11", "3.13", "3.14"]
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true  # ai-platform, at platform/: the protocols shared with ai-cloud
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (PortAudio, the TPM's); a software TPM and a D-Bus for the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libtss2-dev swtpm dbus-daemon pipewire pipewire-pulse
      - name: PipeWire, without which PortAudio does not start on Ubuntu 26.04 (ADR-0013, ADR-0017)
        run: |
          runtime="$RUNNER_TEMP/xdg"
          mkdir -m 700 -p "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime"
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          nohup pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          for _ in $(seq 100); do
            if [ -S "$runtime/pulse/native" ]; then exit 0; fi
            sleep 0.1
          done
          echo "PipeWire's PulseAudio server did not start" >&2
          cat "$RUNNER_TEMP"/pipewire*.log >&2
          exit 1
      - name: Install
        run: python -m pip install -e ".[dev,tpm]"
      - name: LiveKit server, for the tests of conversations' rooms
        env:
          VERSION: "1.13.10"
          SHA256: c25a3e45fb922e9a93c6443d10c0ed041ba64342097e38632331736630283165
        run: |
          archive="$RUNNER_TEMP/livekit.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/livekit/livekit/releases/download/v${VERSION}/livekit_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" livekit-server
          echo "LIVEKIT_SERVER=$RUNNER_TEMP/livekit-server" >> "$GITHUB_ENV"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pure Python)
        run: pytest
      - name: Build the C++ extension
        run: python -m pip install ./native
      - name: Test (with the C++ extension)
        run: pytest
      - name: Smoke run
        run: python -m ai_robot --profile desktop --duration 1
